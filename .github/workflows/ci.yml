name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: MoonBit / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP/moon-install.ps1"
          & "$env:RUNNER_TEMP/moon-install.ps1"
          "$env:USERPROFILE/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: moon version --all
      - run: moon check --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - name: Audit commit authorship
        shell: bash
        run: |
          bad=$(git log --no-merges --format='%an <%ae>|%cn <%ce>' | grep -v 'LMK-ai-nb <315346758+LMK-ai-nb@users.noreply.github.com>|LMK-ai-nb <315346758+LMK-ai-nb@users.noreply.github.com>' || true)
          if [ -n "$bad" ]; then
            echo "::warning title=Commit authorship::Non-standard identities found"
            echo "$bad"
          else
            echo "All non-merge commits use LMK-ai-nb <noreply>."
          fi
      - run: moon run cmd/demo
      - run: node scripts/build.mjs
      - run: node --test tests/cli.test.mjs
      - name: Verify portable package contents
        run: python scripts/package_check.py
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Chromium integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          node scripts/serve.mjs > /tmp/tideweave-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          python tests/browser.py
